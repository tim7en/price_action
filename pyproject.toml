[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "price-action"
version = "0.1.0"
description = "Starter ML pipeline for price action experiments"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
    "lightgbm>=4.5,<5.0",
    "hmmlearn>=0.3,<0.4",
    "yfinance>=0.2,<2.0",
    "exchange-calendars>=4.11,<5.0",
    "matplotlib>=3.9,<4.0",
]

[project.scripts]
price-action-train = "price_action.train:main"
price-action-build-macro-store = "price_action.macro_features:main"
price-action-refresh-data = "price_action.update_data:main"
price-action-panel = "price_action.panel:main"
price-action-macro-report = "price_action.macro_report:main"
price-action-report = "price_action.report:main"
price-action-recommend = "price_action.recommend:main"
price-action-fundamentals = "price_action.fundamentals_analysis:main"
price-action-news-sentiment = "price_action.news_sentiment_research:main"
price-action-spy-vix-fear-greed = "price_action.spy_vix_fear_greed_research:main"
price-action-spy-regime-risk-management = "price_action.spy_regime_risk_management:main"
price-action-spy-drawdown-regime = "price_action.spy_drawdown_regime_research:main"
price-action-sector-dalio-regime = "price_action.sector_dalio_regime_model:main"
price-action-hierarchical-research = "price_action.hierarchical_research:main"
price-action-final-hierarchy = "price_action.final_hierarchy:main"
price-action-factor-drivers = "price_action.factor_driver_model:main"
price-action-binance-session-scalper = "price_action.binance_session_scalper:main"
price-action-nasdaq-session-backtest = "price_action.nasdaq_session_backtest:main"
price-action-nasdaq-poc-scaling-backtest = "price_action.nasdaq_poc_scaling_backtest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/price_action"]
